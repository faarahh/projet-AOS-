version: '3.8'

x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:-wams-jwt-secret-2025-change-in-prod}

# ─────────────────────────────────────────────────────────────────────────────
# SERVICES APPLICATIFS
# ─────────────────────────────────────────────────────────────────────────────
services:

  auth-service:
    build: ./auth-service
    ports: ["5001:5001"]
    environment:
      PORT: 5001
      <<: *jwt
      CONSUL_HOST: consul
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost,http://localhost:3001"
    depends_on: [consul]
    networks: [wams-network]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=5001"

  lists-service:
    build: ./lists-service
    ports: ["5002:5002"]
    environment:
      PORT: 5002
      <<: *jwt
      CONSUL_HOST: consul
      RABBITMQ_HOST: rabbitmq
    depends_on: [consul, rabbitmq, auth-service]
    networks: [wams-network]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lists.rule=PathPrefix(`/api/lists`)"
      - "traefik.http.routers.lists.entrypoints=web"
      - "traefik.http.services.lists.loadbalancer.server.port=5002"

  meals-service:
    build: ./meals-service
    ports: ["5003:5003"]
    environment:
      PORT: 5003
      <<: *jwt
      CONSUL_HOST: consul
      RABBITMQ_HOST: rabbitmq
    depends_on: [consul, rabbitmq, auth-service]
    networks: [wams-network]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meals.rule=PathPrefix(`/api/meals`)"
      - "traefik.http.routers.meals.entrypoints=web"
      - "traefik.http.services.meals.loadbalancer.server.port=5003"

  users-service:
    build: ./users-service
    ports: ["5004:5004"]
    environment:
      PORT: 5004
      <<: *jwt
      CONSUL_HOST: consul
    depends_on: [consul, auth-service]
    networks: [wams-network]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=PathPrefix(`/api/users`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.services.users.loadbalancer.server.port=5004"

  group-service:
    build: ./group-service
    ports: ["5005:5005"]
    environment:
      PORT: 5005
      <<: *jwt
      CONSUL_HOST: consul
    depends_on: [consul, auth-service]
    networks: [wams-network]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.groups.rule=PathPrefix(`/api/groups`)"
      - "traefik.http.routers.groups.entrypoints=web"
      - "traefik.http.services.groups.loadbalancer.server.port=5005"

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    networks:
      - wams-network
    depends_on:
      - auth-service
      - users-service
      - lists-service
      - meals-service
      - group-service

# ─────────────────────────────────────────────────────────────────────────────
# INFRASTRUCTURE
# ─────────────────────────────────────────────────────────────────────────────

  consul:
    image: hashicorp/consul:1.17
    ports: ["8500:8500"]
    command: agent -dev -client=0.0.0.0
    networks: [wams-network]

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: final-project-rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      wams-network:
        aliases:
          - rabbitmq

# ─────────────────────────────────────────────────────────────────────────────
# TRAEFIK — Reverse Proxy / Load Balancer
# ─────────────────────────────────────────────────────────────────────────────

  traefik:
    image: traefik:v2.10
    container_name: traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/conf:/etc/traefik/conf:ro
    networks:
      - wams-network

# ─────────────────────────────────────────────────────────────────────────────
# MONITORING — Prometheus + Grafana
# ─────────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks: [wams-network]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: wams2025
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on: [prometheus]
    networks: [wams-network]

# ─────────────────────────────────────────────────────────────────────────────
# LOGS — Stack ELK
# ─────────────────────────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - wams-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    ports:
      - "5044:5044"
      - "5000:5000/udp"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks:
      - wams-network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - wams-network
    depends_on:
      - elasticsearch

# ─────────────────────────────────────────────────────────────────────────────
networks:
  wams-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  es_data: {}
  rabbitmq_data: